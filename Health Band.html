<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>CalmSignal – stress baseline prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>

#main{flex:1;overflow-y:auto;padding:14px 16px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}

.sub{color:var(--mut);font-size:13px}.big{font:500 54px/1 Fraunces,Georgia,serif}

.btn.sec{background:transparent;color:var(--acc);border:1px solid var(--line)}.btn.red{background:var(--r)}.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}.btn.full{display:block;width:100%}

</style></head><body><div id="app"><div id="main"></div><div id="ov"></div></div>
<script>
/* ===== CONFIG (swap helplines per country before production) ===== */
const HELP=[{n:'Emergency Services',num:'112',d:'Police, fire, ambulance'},{n:'Tele-MANAS (mental health support)',num:'14416',d:'Free mental health support, India'}];
const TRIG=['Studies/Exams','Friends/Relationships','Family','Work/Responsibilities','Sleep/Fatigue','Overthinking','Social Media','Travel/Environment','Physical Discomfort','Something Else'];
const CTXS=['Studying','Resting','Walking','Exercising','Working','Travelling','Sleeping','Socializing','Other'];
const STN={LOW:'LOW STRESS',ELEVATED:'ELEVATED',HIGH:'HIGH STRESS RESPONSE',RECOVERING:'RECOVERING'};
const STC={LOW:'var(--g)',ELEVATED:'var(--a)',HIGH:'var(--o)',RECOVERING:'var(--rec)'};
/* ===== STORE (single shared source: profile, base, events, sessions, journal, contacts) ===== */
const KEY='calmsignal_v1';
const DEF=()=>({profile:null,onb:false,base:{days:0,n:{hr:0,hrv:0,st:0,sp:0},m:{hr:0,hrv:0,st:0,sp:0},v:{hr:0,hrv:0,st:0,sp:0}},events:[],sessions:[],journal:[],contacts:[],set:{auto:false,haptic:true,sp:true,jp:true,ai:false,jmem:false,voice:false},ctx:'Resting'});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}S=S||DEF();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);const fmt=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const fday=t=>new Date(t).toLocaleDateString([],{day:'numeric',month:'short'});
/* ===== BASELINE (running mean/SD per signal; only usable, low-movement samples) ===== */
const FLOOR={hr:3,hrv:6,st:.3,sp:.5},REF={hr:72,hrv:56,st:33.2,sp:98};
const upd=(k,x)=>{const b=S.base,n=++b.n[k],d=x-b.m[k];b.m[k]+=d/n;b.v[k]+=d*(x-b.m[k])};
const sd=k=>S.base.n[k]>1?Math.sqrt(S.base.v[k]/(S.base.n[k]-1)):0;
const active=()=>S.base.days>=7&&S.base.n.hr>=300&&S.base.n.hrv>=300;
const bm=k=>active()?S.base.m[k]:REF[k];
const rng=k=>{const m=S.base.m[k],s=Math.max(sd(k),FLOOR[k])*1.2;return[m-s,m+s]};
const rtxt=(k,d=0)=>S.base.n[k]>30?rng(k).map(x=>x.toFixed(d)).join('–'):'learning';
/* ===== SENSOR PROVIDER (mock; replace read()/status() with ESP32 BLE adapter) ===== */
const SC={normal:{hr:72,hrv:56,sp:98,st:33.2,act:'Resting',mv:'Low'},elevated:{hr:88,hrv:38,sp:97,st:32.9,act:'Sitting',mv:'Low'},high:{hr:106,hrv:22,sp:97,st:32.2,act:'Sitting',mv:'Low'},recovery:{hr:79,hrv:46,sp:98,st:33,act:'Resting',mv:'Low'},walking:{hr:96,hrv:44,sp:98,st:33.4,act:'Walking',mv:'Moderate'},exercising:{hr:134,hrv:18,sp:97,st:34.1,act:'Running',mv:'High'},learning:{hr:72,hrv:56,sp:98,st:33.2,act:'Resting',mv:'Low'}};
const SCN={normal:'Normal',elevated:'Elevated stress',high:'High stress response',recovery:'Recovery',walking:'Walking',exercising:'Exercising',learning:'Baseline learning'};
const P={sc:'normal',c:{...SC.normal,amb:27.5,hum:62},dropSp:false,
tick(){const t=SC[this.sc],c=this.c,nz={hr:2,hrv:2.5,sp:.3,st:.05};for(const k in nz)c[k]+=(t[k]-c[k])*.15+(Math.random()-.5)*nz[k];c.act=t.act;c.mv=t.mv;c.amb=27.5+Math.sin(Date.now()/6e4)*.4;c.hum=62+Math.cos(Date.now()/9e4)*2;return this.read()},
read(){const c=this.c;return{hr:Math.round(c.hr),hrv:Math.round(c.hrv),sp:this.dropSp?null:Math.round(Math.min(100,c.sp)),st:+c.st.toFixed(1),act:c.act,mv:c.mv,amb:+c.amb.toFixed(1),hum:Math.round(c.hum)}},
status(){const s='Simulated';return[['ESP32 board',s],['ECG (AD8232)',s],['Pulse / SpO₂',this.dropSp?'Signal lost':s],['Skin temperature',s],['DHT22',s],['IMU',s],['Thermal camera','Simulated · no camera']]}};
/* ===== STRESS ENGINE (rule-based multimodal prototype; swap step() for a trained model) ===== */
const cl=x=>Math.max(0,Math.min(1,x));
const E={sc:0,state:'LOW',stage:'NORMAL',r:P.read(),ring:[],hist:[],ev:null,calm:0,dis:0,
step(r){this.r=r;const prev=this.state;const ex=['Exercising','Walking'].includes(S.ctx)||r.mv!=='Low';
let raw=100*(.45*cl((r.hr-bm('hr'))/35)+.4*cl((bm('hrv')-r.hrv)/35)+.15*cl((bm('st')-r.st)/1.5));if(ex)raw*=.2;
this.sc=this.sc*.75+raw*.25;const s=this.sc;
let L=s>=62||(prev==='HIGH'&&s>=50)?'HIGH':s>=35||(prev==='ELEVATED'&&s>=28)?'ELEVATED':'LOW';
if(L==='LOW'&&['HIGH','ELEVATED','RECOVERING'].includes(prev)&&s>=22)L='RECOVERING';
this.hist.push(s);if(this.hist.length>600)this.hist.shift();const d=s-(this.hist[this.hist.length-16]??s);
this.stage=L==='HIGH'?'HIGH':L==='RECOVERING'?'RECOVERING':L==='ELEVATED'?(d>=4?'RISING':'EARLY SIGNS'):(active()&&s>=20&&d>=6?'EARLY SIGNS':'NORMAL');
const row={t:Date.now(),hr:r.hr,hrv:r.hrv,sc:Math.round(s),st:r.st,sp:r.sp,act:r.act,amb:r.amb,hum:r.hum};
this.ring.push(row);if(this.ring.length>300)this.ring.shift();this.state=L;
if(L!==prev){const lab={ELEVATED:'Readings moving away from your usual pattern',HIGH:'High-confidence stress response',RECOVERING:'Recovering',LOW:'Closer to baseline'}[L];
 if(!this.ev&&(L==='ELEVATED'||L==='HIGH')){this.ev={id:uid(),start:row.t,end:null,peak:L,peakSc:row.sc,ctx:S.ctx,personal:active(),b:{hr:bm('hr'),hrv:bm('hrv'),st:bm('st')},rec:this.ring.slice(-30),marks:[]};S.events.push(this.ev)}
 if(this.ev)this.ev.marks.push({t:row.t,label:lab});
 if(L==='HIGH'&&S.set.auto&&!SUP.run)SUP.open('breath')}
const ev=this.ev;if(ev){if(ev.rec[ev.rec.length-1]!==row)ev.rec.push(row);if(row.sc>=ev.peakSc){ev.peakSc=row.sc;ev.peakRow=row}
 if(L==='HIGH')ev.peak='HIGH';if(L==='LOW'){if(++this.calm>=20){ev.end=row.t;ev.after=row;this.ev=null;this.calm=0;save()}}else this.calm=0}}};
const openEv=()=>E.ev;const lastEv=()=>S.events[S.events.length-1];
/* ===== SUPPORT (breathing + grounding + check-in) ===== */
const PH=[['INHALE',4],['HOLD',4],['EXHALE',6],['REST',2]],TOT=96;
const HAP={INHALE:[150,350,150,350,150,350,150,350],HOLD:[400],EXHALE:[900,200,900,200,900,200],REST:[]};
const SUP={run:false,mode:'choose',el:0,paused:false,tm:null,ph:'',sess:null,gi:0,
open(m){this.run=true;this.mode=m;OV.length=0;OV.push({k:'support'});ov();if(m==='breath')this.start()},
start(){this.stop();this.mode='breath';this.el=0;this.paused=false;this.ph='';
 this.sess={id:uid(),type:'Guided breathing',start:Date.now(),hr0:E.r.hr,evId:E.ev?E.ev.id:(lastEv()&&!lastEv().end?lastEv().id:null)};
 if(E.ev)E.ev.marks.push({t:Date.now(),label:'Silent Support started'});ov();
 this.tm=setInterval(()=>{if(this.paused)return;this.el+=.1;this.tick()},100)},
stop(){clearInterval(this.tm);this.tm=null},
tick(){if(this.el>=TOT){return this.finish()}let t=this.el%16,i=0;while(t>=PH[i][1]){t-=PH[i][1];i++}const[n,d]=PH[i];
 if(n!==this.ph){this.ph=n;const c=$('#circ'),pl=$('#pl'),vb=$('#vb');if(c){c.style.transition=`transform ${n==='INHALE'||n==='EXHALE'?d:0}s linear`;c.style.transform=n==='INHALE'?'scale(1)':n==='EXHALE'?'scale(.55)':c.style.transform||'scale(.55)'}
  if(pl)pl.textContent=n;const can=S.set.haptic&&navigator.vibrate;if(can)navigator.vibrate(HAP[n]);if(vb)vb.textContent=!S.set.haptic?'Haptics off':can?'Vibration active':'Simulated vibration (this device cannot vibrate)'}
 const tm=$('#tl');if(tm)tm.textContent=Math.max(0,Math.ceil(TOT-this.el))+'s left'},
pause(){this.paused=!this.paused;const b=$('#pb');if(b)b.textContent=this.paused?'Resume':'Pause';if(this.paused&&navigator.vibrate)navigator.vibrate(0)},
finish(){this.stop();if(navigator.vibrate)navigator.vibrate(0);if(this.sess){this.sess.dur=Math.round(this.el);this.sess.hr1=E.r.hr}this.mode='check';ov()},
rate(f){const s=this.sess;if(s&&!S.sessions.includes(s)){s.fb=f;s.hr1=E.r.hr;S.sessions.push(s);const ev=S.events.find(e=>e.id===s.evId);if(ev)ev.marks.push({t:Date.now(),label:'Check-in: '+f});save()}this.fb=f;this.mode='after';ov()},
close(){this.stop();if(navigator.vibrate)navigator.vibrate(0);this.run=false;OV.length=0;ov();render()}};
/* ===== CHATBOT (simulated rules – no external AI service connected) ===== */
const CH=[];
function chatCtx(){const r=E.r;let t=`Right now: ${STN[E.state].toLowerCase()}, heart rate ${r.hr} BPM, HRV ${r.hrv} ms${r.sp==null?'':', SpO₂ '+r.sp+'%'}.`;
 if(S.set.ai&&S.set.jmem){const j=S.journal.filter(x=>x.incl);if(j.length){const c={};j.forEach(x=>c[x.trig]=(c[x.trig]||0)+1);const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0];t+=` You've previously mentioned ${top}. Is today related to that, or something different?`}}return t}
function reply(q){const s=q.toLowerCase();
 if(/(hurt myself|suicid|kill myself|end my life|in danger|can't go on|cant go on)/.test(s))return{t:"I'm really sorry you're feeling this way. I can't assess emergencies, but you deserve immediate support. Please contact someone now – nothing is called unless you tap.",em:1};
 if(/calm|breath/.test(s))return{t:"Let's slow things down. I can start a silent breathing session, or a grounding exercise if you prefer.",act:1};
 if(/read|mean|explain/.test(s)){const b=active()?`Your usual heart rate range is about ${rtxt('hr')} BPM.`:'Your baseline is still developing, so I can only describe, not compare.';return{t:`${chatCtx()} ${b} Readings can shift with movement, environment, caffeine or sleep, so this isn't proof of why you feel this way.`}}
 if(/journal|write/.test(s))return{t:'I can open the Trigger Journal. You don\'t have to explain anything you don\'t want to.',j:1};
 return{t:`Thanks for sharing. I'm a simulated assistant, not a therapist, and I can't diagnose anything. ${chatCtx()} Would a breathing exercise, grounding, or journaling help right now?`}}
/* ===== VIEWS ===== */
let TAB='home',RANGE='today',OV=[];
const meter=(c)=>c<=2?'':'';
const val=(k)=>{const r=E.r;return k==='sp'?(r.sp==null?'—':r.sp):r[k]};
const insight=()=>{const r=E.r,s=E.state;if(r.sp==null)return'The SpO₂ signal is unreliable right now, so it is left out of the analysis rather than treated as normal.';
 if(['Exercising','Walking'].includes(S.ctx)||r.mv!=='Low')return'Your heart rate is higher alongside movement. This is not treated as a stress response.';
 if(!active())return'Your baseline is still developing, so live readings are shown without personal comparisons.';
 if(s==='ELEVATED'||s==='HIGH')return`Your heart rate (${r.hr} BPM) is above your usual ${rtxt('hr')} range and HRV (${r.hrv} ms) is lower while movement remains low. Signals change for many reasons, so this doesn't tell us the cause.`;
 if(s==='RECOVERING')return'Your readings are moving back toward your usual range.';
 return`Your readings are within your usual pattern for now (heart rate usual range ${rtxt('hr')} BPM).`};
const metric=(k,l,u)=>`<div class="card" style="margin:0"><div class="u">${l}</div><div class="m"><span data-v="${k}">${val(k)}</span> <span class="u">${u}</span></div></div>`;
function home(){const hr=new Date().getHours(),g=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening',st=E.state,r=E.r,e=lastEv(),ses=S.sessions.length;
 const cmp=active()?`Heart rate usual range: ${rtxt('hr')} BPM · HRV: ${rtxt('hrv')} ms`:'Your baseline is still developing.';
 return`<h1>${g}, ${esc(S.profile.name.split(' ')[0])}</h1><div class="sub">Your current state</div>
<div class="card" style="margin-top:10px;border-left:6px solid ${STC[st]}"><div class="row sp"><h2 style="color:${STC[st]}" data-v="state">${STN[st]}</h2><span class="tag">${E.stage}</span></div>
<div class="big"><span data-v="score">${Math.round(E.sc)}</span><span class="u">/100</span></div><div class="sub">Estimated stress score – not a medical measurement or diagnosis.</div><div class="sub" style="margin-top:6px">${cmp}</div>
<div class="row wrap" style="margin-top:10px"><button class="btn sm" data-a="supp">Support</button><button class="btn sm sec" data-a="chat">Talk to me</button></div></div>
${E.stage==='EARLY SIGNS'||E.stage==='RISING'?(Date.now()>E.dis?`<div class="card"><h3>Early signs <span class="tag">experimental</span></h3><div class="sub">Your readings are beginning to move away from your usual pattern. This is a personalized experiment, not a prediction.</div><div class="row" style="margin-top:8px"><button class="btn sm" data-a="reset">Start a 60-second reset?</button><button class="btn sm sec" data-a="dis">Dismiss</button></div></div>`:''):''}
${st==='HIGH'&&!SUP.run&&!(E.ev&&E.ev.offered)?`<div class="card" style="border-color:var(--o)"><h3>High-confidence stress response</h3><div class="sub">Start Silent Support? Follow the vibration – no sound.</div><div class="row" style="margin-top:8px"><button class="btn sm" data-a="start">START</button><button class="btn sm sec" data-a="notnow">NOT NOW</button></div></div>`:''}
<div class="g2" style="margin-bottom:12px">${metric('hr','Heart rate','BPM')}${metric('hrv','HRV','ms')}${metric('sp','SpO₂','%')}${metric('st','Skin temp','°C')}<div class="card" style="margin:0;grid-column:span 2"><div class="u">Activity</div><div class="m" style="font-size:18px">${r.act} · ${r.mv} intensity</div></div></div>
<div class="card"><h3>AI insight <span class="tag">rule-based</span></h3><div data-v="insight">${insight()}</div></div>
<div class="card"><h3>Context (optional)</h3><div class="row wrap">${CTXS.map(c=>`<button class="chip ${S.ctx===c?'on':''}" data-a="ctx" data-c="${c}">${c}</button>`).join('')}</div></div>
<div class="card"><h3>Most recent event</h3>${e?`<button class="chip" style="width:100%;text-align:left;border-radius:12px" data-a="ev" data-id="${e.id}">${fmt(e.start)} · peak ${STN[e.peak]} ${e.end?'':'(ongoing)'}</button>`:'<div class="sub">No stress events recorded yet.</div>'}</div>
<div class="sub">Prototype, not a medical device. It does not diagnose any condition. Signals vary with movement, environment and ordinary variation.</div>`}
function ecgHTML(){return`<canvas id="ecg"></canvas>`}
function monitor(){const r=E.r,pr=active()||S.base.n.hr>30;const st=P.status();
 const hot=[...Array(48)].map((_,i)=>{const x=i%8,y=Math.floor(i/8),d=Math.hypot(x-3.5,y-2.5),t=(r.st-30)/6+.3-d*.07;return`<div class="cell" style="background:hsl(${Math.round(260-cl(t)*250)} 70% 50%)"></div>`}).join('');
 return`<h1>Live monitor</h1><div class="sub">All readings are simulated in this prototype.</div>
<div class="card" style="margin-top:10px"><h2>Heart</h2><div class="g2"><div><div class="m"><span data-v="hr">${r.hr}</span> <span class="u">BPM</span></div><div class="u">usual ${rtxt('hr')}</div></div><div><div class="m"><span data-v="hrv">${r.hrv}</span> <span class="u">ms HRV</span></div><div class="u">usual ${rtxt('hrv')}</div></div></div>${ecgHTML()}<div class="u">ECG waveform: simulated, not from a sensor</div></div>
<div class="card"><h2>Oxygen</h2><div class="g2"><div><div class="m" data-v="sp2">${r.sp==null?'Unreliable':r.sp+'%'}</div><div class="u">SpO₂</div></div><div><div class="m">${r.hr} <span class="u">BPM</span></div><div class="u">Pulse</div></div></div>${r.sp==null?'<div class="err">No reliable signal – not treated as a normal reading.</div>':''}</div>
<div class="card"><h2>Temperature</h2><div class="g2"><div><div class="m" data-v="st">${r.st}°C</div><div class="u">Skin</div></div><div><div class="m">${r.amb}°C · ${r.hum}%</div><div class="u">Ambient · humidity (DHT22)</div></div></div></div>
<div class="card"><h2>Movement</h2><div class="m" style="font-size:20px">${r.act} · ${r.mv} intensity</div><details><summary class="sub">Technical details</summary><div class="sub">Raw accelerometer values: simulated, ${(r.mv==='Low'?0.02:r.mv==='Moderate'?0.4:1.1).toFixed(2)} g RMS</div></details></div>
<div class="card"><h2>Thermal</h2><div style="display:grid;grid-template-columns:repeat(8,1fr);gap:1px;border-radius:10px;overflow:hidden">${hot}</div><div class="u"><b>SIMULATED</b> thermal visualization. No thermal camera is connected; this is not real data.</div></div>

function rangeEv(){const d={today:864e5,week:6048e5,month:2592e6}[RANGE],t=Date.now()-d;return S.events.filter(e=>e.start>t)}

setInterval(()=>{const r=P.tick();E.step(r);const b=S.base;if(r.mv==='Low'&&E.state==='LOW'&&!['Exercising','Walking'].includes(S.ctx)&&(b.days<7||Math.random()<.2)){['hr','hrv','st'].forEach(k=>upd(k,r[k]));if(r.sp!=null)upd('sp',r.sp)}
 if(S.profile&&S.onb){const sig=E.state+E.stage+active()+r.sp+(E.ev&&E.ev.offered)+(Date.now()>E.dis);if(sig!==lastSig){lastSig=sig;if(!OV.length)render()}else live()}},1000);
/* ECG (simulated waveform) */
let ecgOn=false,buf=[],ph=0,lt=0;const g=(x,c,w,a)=>a*Math.exp(-((x-c)**2)/(2*w*w));
function ecgStart(){if(ecgOn)return;ecgOn=true;lt=performance.now();requestAnimationFrame(ecgLoop)}
function ecgLoop(t){const c=$('#ecg');if(!c){ecgOn=false;return}const dt=(t-lt)/1000;lt=t;ph+=dt*E.r.hr/60;
 const n=Math.max(1,Math.round(dt*120));for(let i=0;i<n;i++){const x=(ph+i*0)%1;buf.push(g(x,.15,.025,.12)-g(x,.27,.008,.12)+g(x,.3,.01,1)-g(x,.33,.01,.2)+g(x,.55,.04,.25)+(Math.random()-.5)*.02)}
 while(buf.length>300)buf.shift();const w=c.width=c.clientWidth,h=c.height=c.clientHeight,x=c.getContext('2d');x.strokeStyle=getComputedStyle(document.body).getPropertyValue('--g')||'#3E9A74';x.strokeStyle='#3E9A74';x.lineWidth=1.6;x.beginPath();buf.forEach((v,i)=>{const px=i*w/300,py=h*.8-v*h*.65;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();requestAnimationFrame(ecgLoop)}
/* ===== ACTIONS ===== */
const gv=id=>$('#'+id)?.value??'';
const A={
tab(d){TAB=d.t;render();$('#main').scrollTop=0},range(d){RANGE=d.r;render()},ctx(d){S.ctx=d.c;save();render()},
dis(){E.dis=Date.now()+3e5;render()},reset(){SUP.open('breath')},start(){if(E.ev)E.ev.offered=1;SUP.open('breath')},notnow(){if(E.ev)E.ev.offered=1;render()},
supp(){SUP.run=true;SUP.mode='choose';push({k:'support'})},sb(){SUP.run=true;SUP.start()},sg(){SUP.stop();SUP.run=true;SUP.mode='ground';SUP.gi=0;ov()},
gnext(){if(++SUP.gi>2){SUP.sess={id:uid(),type:'Grounding',start:Date.now(),hr0:E.r.hr,dur:60,evId:E.ev?.id||null};SUP.mode='check';SUP.gi=0}ov()},
pause(){SUP.pause()},sfin(){SUP.finish()},sclose(){SUP.close()},rate(d){SUP.rate(d.f)},
back(){if(SUP.run&&OV[OV.length-1].k==='support'){SUP.close();return}OV.pop();ov();render()},
chat(){SUP.stop();OV=OV.filter(o=>o.k!=='support');push({k:'chat'})},emerg(){push({k:'emerg'})},emerg2(){push({k:'emerg'})},contact(){push({k:'contact'})},
ev(d){push({k:'ev',id:d.id})},demo(){push({k:'demo'})},scn(d){P.sc=d.k;E.dis=0;ov()},drop(){P.dropSp=!P.dropSp;ov()},
day(){const b=S.base;if(b.days<7)b.days++;for(let i=0;i<60;i++){['hr','hrv','st','sp'].forEach(k=>upd(k,SC.normal[k]+(Math.random()-.5)*({hr:6,hrv:8,st:.4,sp:1}[k])))}save();ov();render()},
cq(d){say(d.q)},csend(){const v=gv('ci').trim();if(v)say(v)},
jnew(){push({k:'jform'})},jnew2(){OV=OV.filter(o=>o.k!=='support');SUP.run=false;push({k:'jform',ev:SUP.sess?.evId})},jnew3(d){push({k:'jform',ev:d.id})},jedit(d){push({k:'jform',id:d.id})},
jdel(d){if(confirm('Delete this entry?')){S.journal=S.journal.filter(x=>x.id!==d.id);save();render()}},
jt(d,b){document.querySelectorAll('#tr .chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');b.dataset.sel=1},
voice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S.set.voice){$('#vn').textContent='Voice transcripts are off in Privacy & data.';return}
 if(SR){const r=new SR();r.onresult=e=>{$('#jx').value+=(' '+e.results[0][0].transcript).trim();$('#vn').textContent='Transcribed by browser speech recognition.'};r.onerror=()=>$('#vn').textContent='Speech recognition failed.';r.start()}else{$('#jx').value+=' [Simulated transcript: I keep worrying about tomorrow.]';$('#vn').textContent='SIMULATED voice input – speech recognition unavailable here.'}},
jsave(d){const t=document.querySelector('#tr .chip.on')?.dataset.t||document.querySelector('#tr .chip.on')?.textContent;if(!t){$('#je').textContent='Choose what was happening.';return}
 const o=OV[OV.length-1],ex=d.id?S.journal.find(x=>x.id===d.id):null,f={trig:t,sub:gv('js').trim(),text:gv('jx').trim(),incl:$('#ji').checked};
 if(ex)Object.assign(ex,f);else{const r=E.r;S.journal.push({id:uid(),t:Date.now(),...f,hr:r.hr,hrv:r.hrv,sc:Math.round(E.sc),evId:o.ev||E.ev?.id||null,sess:S.sessions.some(s=>s.evId&&s.evId===(o.ev||E.ev?.id))})}save();OV.pop();ov();render()},
cadd(){push({k:'cform'})},cedit(d){push({k:'cform',id:d.id})},cpri(d){const c=S.contacts.find(x=>x.id===d.id);c.pri=c.pri?0:1;save();ov()},
cdel(d){if(confirm('Delete this contact?')){S.contacts=S.contacts.filter(x=>x.id!==d.id);save();ov()}},
csave(d){const n=gv('cn').trim(),p=gv('cp').trim(),dg=p.replace(/\D/g,'').length;if(n.length<2){$('#ce').textContent='Enter the contact\'s name.';return}
 if(!/^\+?[\d\s-]+$/.test(p)||dg<7||dg>15){$('#ce').textContent='Enter a valid phone number (7–15 digits, optional +).';return}
 const f={name:n,rel:gv('cr'),ph:p,pri:$('#cpr').checked?1:0},ex=d.id&&S.contacts.find(x=>x.id===d.id);if(ex)Object.assign(ex,f);else S.contacts.push({id:uid(),...f});save();OV.pop();ov()},
tog(d,b){S.set[d.k]=b.checked;save()},
psave(){const{e,v}=validate(gv);['fn','ag','wt','ht'].forEach((k,i)=>$('#e'+(i+1)).textContent=e[k]||'');if(Object.keys(e).length)return;S.profile=v;save();render()},
onb(){S.onb=true;save();render()},pedit(){push({k:'pform'})},
psave2(){const{e,v}=validate(gv);if(Object.keys(e).length){$('#pe').textContent=Object.values(e)[0];return}S.profile=v;save();OV.pop();ov();render()},
rbase(){if(confirm('Reset your personal baseline? Learning restarts at day 1.')){S.base=DEF().base;save();render()}},
delcon(){if(confirm('Delete all emergency contacts?')){S.contacts=[];save();render()}},
delall(){if(confirm('Delete ALL app data, including profile, journal and contacts?')){S=DEF();save();E.ev=null;E.sc=0;E.state='LOW';TAB='home';OV=[];ov();render()}}};
function say(q){CH.push({r:'me',t:q});const r=reply(q);CH.push({r:'bot',t:r.t});ov();const m=$('#msgs');
 if(r.act||r.em||r.j){const d=document.createElement('div');d.className='row wrap';d.innerHTML=(r.act?'<button class="btn sm" data-a="sb">Start breathing</button><button class="btn sm sec" data-a="sg">Grounding</button>':'')+(r.em?'<button class="btn sm red" data-a="emerg2">Get emergency help</button>':'')+(r.j?'<button class="btn sm" data-a="jnew">Open journal</button>':'');m.appendChild(d)}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset,b)});
document.addEventListener('input',e=>{if(e.target.id==='rp')setReplay()});
render();
